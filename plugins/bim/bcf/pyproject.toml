[project]
name = "deskgate-bcf"
version = "0.1.0"
description = "Écriture BCF 2.1 pour Deskgate à partir d'un JSON versionné (GPL-3.0-or-later)"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["bcf-client==0.9.0", "ifcopenshell==0.9.0.post1", "jsonschema>=4,<5"]

[project.scripts]
deskgate-bcf = "deskgate_bcf.cli:main"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskgate_bcf"]
