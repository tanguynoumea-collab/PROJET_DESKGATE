[project]
name = "deskgate"
version = "0.1.0.dev0"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.151,<0.152", "uvicorn>=0.54,<0.55", "pydantic>=2.14,<3", "platformdirs>=4.13", "typer>=0.27,<0.28", "httpx2>=2.15,<3", "mcp>=2.3,<3"]

[project.scripts]
deskgate = "deskgate.cli:app"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskgate", "src/deskgate_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["plugins", ".planning", ".arthemis", ".claude", ".cache"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["plugins/bim", "plugins/bim/bcf"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "pytest-timeout>=2.4", "psutil>=7.2", "ruff>=0.17,<0.18", "pyright>=1.1.414"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".planning", ".arthemis", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"plugins/**/tests/**" = ["S101", "S603", "S607"]
"plugins/conftest.py" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
pythonpath = ["tests"]
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]
markers = [
  "unit: noyau pur, sans disque, serveur ni sous-processus",
  "fs: vrai système de fichiers (jonctions, ADS, noms réservés)",
  "proc: vrais sous-processus Windows",
  "e2e: deskgate serve en sous-processus",
  "bim: exige les environnements uv des plugins (deskgate-bim, deskgate-bcf)",
  "mcp: serveur MCP réel en sous-processus",
  "scheduler: crée une vraie tâche du Planificateur Windows (supprimée en fin de test)",
  "docker: exige Docker Desktop et docker compose (échec explicite sans Docker)",
]
